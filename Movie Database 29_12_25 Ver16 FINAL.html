<html lang="en">

<style>

<body>

<script>
/* ============================
  MovieDB — IndexedDB implementation (fixed + add/delete)
  - Restored original layout and styling
  - Added single-item manual add modal
  - Added delete for entries lacking OMDb data
  - Filter drawer and export use filtered rows
  ============================ */

const DEFAULT_OMDB_KEY = '6914a6cb'; // embedded as requested

// ---------- IndexedDB helper ----------
const DB_NAME = 'movie_db_v1';
const STORE_NAME = 'movies';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (evt) => {
      const db = evt.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)){
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('by_title', 'title', { unique: false });
        store.createIndex('by_title_lower', 'title_lower', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function addOrUpdateMovie(movie){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);

    // Always keep title_lower in sync
    const titleLower = (movie.title || '').toLowerCase();
    movie.title_lower = titleLower;

    // ✅ If this record already has an ID, it MUST be an update (put), not add
    if (movie.id !== undefined && movie.id !== null) {
      const putReq = store.put(movie); // upsert by primary key
      putReq.onsuccess = () => resolve(movie);
      putReq.onerror = () => reject(putReq.error);
      return;
    }
async function deleteMovieById(id){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(['movies'], 'readwrite');   // <-- change 'movies' if your store name differs
    const store = tx.objectStore('movies');
    const req = store.delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}
    // Otherwise, try to de-duplicate by title_lower
    const idx = store.index('by_title_lower');
    const q = idx.get(titleLower);

    q.onsuccess = () => {
      const found = q.result || null;

      if(found){
        const updated = { ...found, ...movie };
        updated.title_lower = (updated.title || '').toLowerCase();

        const putReq = store.put(updated);
        putReq.onsuccess = () => resolve(updated);
        putReq.onerror = () => reject(putReq.error);
      } else {
        // ✅ Ensure we don't accidentally carry an id into an add()
        const rec = { ...movie };
        delete rec.id;

        const addReq = store.add(rec);
        addReq.onsuccess = (e) => { rec.id = e.target.result; resolve(rec); };
        addReq.onerror = () => reject(addReq.error);
      }
    };

    q.onerror = () => reject(q.error);
  });
}

async function deleteMovieById(id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(Number(id));
    req.onsuccess = async () => { await refreshRecords(); resolve(); };
    req.onerror = () => reject(req.error);
  });
}
function isMissingRow(r){
  // “missing” means: fetched and error OR no meaningful OMDb data
  if(!r) return false;
  if(r.fetched && r.error) return true;
  const hasMeaningful = (r.poster && r.poster !== '') || (r.imdb && r.imdb !== '') || (r.plot && r.plot !== '');
  return !hasMeaningful;
}

async function refetchSingleRow(r){
  const key = apiKeyInput.value.trim() || DEFAULT_OMDB_KEY;
  if(!key) return alert('OMDb key missing.');
  try{
    const data = await fetchOneOMDb(key, r.title);
    if(data && data.Response === 'True'){
      r.year = data.Year || '';
      r.imdb = (data.imdbRating && data.imdbRating !== 'N/A') ? data.imdbRating : '';
      r.language = (data.Language || '').split(',').map(s=>s.trim()).filter(Boolean).join(', ');
      r.genre = data.Genre || '';
      r.type = (data.Type || '').toLowerCase();
      r.plot = data.Plot || '';
      r.poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : '';
      r.actors = data.Actors ? data.Actors.split(',').map(a=>a.trim()).filter(Boolean) : [];
      r.imdbID = data.imdbID || r.imdbID || '';
      r.totalSeasons = data.totalSeasons || r.totalSeasons || '';
      r.fetched = true; r.error = null;
    } else {
      r.fetched = true; r.error = (data && data.Error) ? data.Error : 'Not found';
    }
    await addOrUpdateMovie(r);
    await refreshRecords();
  }catch(err){
    alert('Re-fetch failed: ' + err.message);
  }
}

async function promptAndRename(r){
  const newName = prompt('Enter corrected title:', r.title || '');
  if(!newName) return;
  r.title = newName.trim();
  r.title_lower = r.title.toLowerCase();
  r.fetched = false;
  r.error = null;
  await addOrUpdateMovie(r);
  await refreshRecords();
}

async function getAllMovies(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function findMovieByTitle(title){
  if(!title) return null;
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const idx = store.index('by_title_lower');
    const req = idx.get(title.toLowerCase());
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

/* ---------------------------
   App state and DOM refs
   --------------------------- */
let records = []; // loaded from DB
let columnValues = {}; // for popovers
let activeFilters = {}; // key -> Set
let openPopoverKey = null;
let lastVisibleIndices = [];
let imdbFilter = { enabled:false, mode:'between', min:0, max:10, val:7 };
const excelInput = document.getElementById('excelInput');
const btnPick = document.getElementById('btnPick');
const btnImport = document.getElementById('btnImport');
const btnExport = document.getElementById('btnExport');
const btnExportHTML = document.getElementById('btnExportHTML');
const apiKeyInput = document.getElementById('apiKey');
const btnReset = document.getElementById('btnReset');
const smallSearch = document.getElementById('smallSearch');
const resultsBody = document.getElementById('resultsBody');
const filterContainer = document.getElementById('filterContainer');
const progressBar = document.getElementById('progressBar');
const errorLog = document.getElementById('errorLog');

const detailPanel = document.getElementById('detailPanel');
const detailPoster = document.getElementById('detailPoster');

/* ---------------------------
   Excel handling (append)
   --------------------------- */
function handleFileUpload(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const data = new Uint8Array(ev.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    // expected columns: Title (or title), Platform, Trailer (optional)
    let added = 0;
    for(const row of json){
      let titleRaw = row.Title ?? row.title ?? row.Name ?? row.name;

// ✅ allow numeric titles (e.g., 123, 777) and avoid stopping
if(titleRaw === null || titleRaw === undefined) continue;

const title = String(titleRaw).trim();
if(!title) continue;
      const platform = row.Platform || row.platform || '';
      const trailer = row.Trailer || row.trailer || '';
      // check duplicate quickly
      const existing = await findMovieByTitle(title);
      if(existing) {
        // update platform/trailer if missing
        const patched = { ...existing };
        if(!patched.platform && platform) patched.platform = platform;
        if(!patched.trailer && trailer) patched.trailer = trailer;
        await addOrUpdateMovie(patched);
      } else {
        // insert minimal record; other metadata will be fetched later
        const rec = { title: title, platform: platform, trailer: trailer, fetched: false, error: null };
        await addOrUpdateMovie(rec);
        added++;
      }
    }
    records = await getAllMovies();
    buildColumnValues();
    renderTable();
    alert('Upload complete — ' + (added) + ' new rows appended to local DB.');
    e.target.value = '';
  };
  reader.readAsArrayBuffer(f);
}

/* ---------------------------
   Fetch missing entries (OMDb)
   --------------------------- */
async function fetchMissingFromDB(){
  const key = apiKeyInput.value.trim() || DEFAULT_OMDB_KEY;
  if(!key) return alert('OMDb API key required (or embedded key will be used).');

  const toFetch = records.filter(r => {
  const hasImdbID = /^tt\d{4,}$/.test((r.imdbID || '').trim());
  const missingCore = !r.year && !r.genre && !r.language && !r.plot && !r.poster && !r.imdb;
  return (!r.fetched) || missingCore || (hasImdbID && r.error);
});

  if(toFetch.length === 0) return alert('No missing records to fetch.');

  progressBar.style.width = '0%';
  let completed = 0;

  for(const r of toFetch){
    try{
      normalizeImdbId(r);
        const data = await fetchOneOMDb(key, { imdbID: r.imdbID, title: r.title });


      if(data && data.Response === 'True'){
	// If we fetched using IMDb ID, trust OMDb Title (fix wrong-name problem permanently)
	if(isImdbId(r.imdbID) && data.Title && data.Title !== 'N/A'){
 	r.title = data.Title;
  	r.title_lower = r.title.toLowerCase();}       

	r.year = data.Year || '';
        r.imdb = (data.imdbRating && data.imdbRating !== 'N/A') ? data.imdbRating : '';
        r.language = (data.Language || '').split(',').map(s=>s.trim()).filter(Boolean).join(', ');
        r.genre = data.Genre || '';
        r.type = (data.Type || '').toLowerCase();
        r.plot = data.Plot || '';
	r.imdbID = data.imdbID || r.imdbID || '';
	r.totalSeasons = data.totalSeasons || r.totalSeasons || '';
        r.poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : '';
        r.actors = data.Actors ? data.Actors.split(',').map(a=>a.trim()).filter(Boolean) : [];
        r.fetched = true; 
        r.error = null;
      } else {
        r.fetched = true; 
        r.error = (data && data.Error) ? data.Error : 'Not found';
      }

    } catch(err){
      r.fetched = true; 
      r.error = err.message || 'Fetch failed';
    }

    await addOrUpdateMovie(r);

    completed++;
    progressBar.style.width = Math.round((completed / toFetch.length) * 100) + '%';

    // ✅ light UI update every 10 items only (optional but recommended)
    if(completed % 10 === 0){
      buildColumnValues();
      renderTable();
    }

    await new Promise(res => setTimeout(res, 120));
  }

  // ✅ refresh ONCE at the end (this is the key fix)
  await refreshRecords();

  progressBar.style.width = '0%';
  alert('Fetch complete.');
}

/* ---------------------------
   OMDb fetch helper
   --------------------------- */
function fetchOneOMDb(key, opts){
  // opts can be: { title } OR { imdbID } OR { imdbID, season } OR { imdbID, season, episode }
  let url = `https://www.omdbapi.com/?apikey=${encodeURIComponent(key)}&plot=short&r=json`;

  if(opts && opts.imdbID){
    url += `&i=${encodeURIComponent(opts.imdbID)}`;
    if(opts.season) url += `&Season=${encodeURIComponent(opts.season)}`;
    if(opts.episode) url += `&Episode=${encodeURIComponent(opts.episode)}`;
  } else {
    url += `&t=${encodeURIComponent((opts && opts.title) ? opts.title : '')}`;
  }

  return fetch(url).then(r => r.json());
}



function closeOnOutsideClick(panelEl, isOpenFn, closeFn, allowBtnEls = []){
  document.addEventListener('mousedown', (e) => {
    if(!isOpenFn()) return;

    // if click was on any "allowed" button that opens the panel, don't close
    for(const b of allowBtnEls){
      if(b && (e.target === b || b.contains(e.target))) return;
    }

    // if click is inside panel, don't close
    if(panelEl && (e.target === panelEl || panelEl.contains(e.target))) return;

    closeFn();
  });
}

/* ---------------------------
   Column values + Filters popovers
   --------------------------- */
const columnKeys = ['year','platform','imdb','language','genre','type','totalSeasons'];


function buildColumnValues(){
  columnValues = {};
  columnKeys.forEach(k => columnValues[k] = new Set());

  records.forEach(r => {
    // YEAR => release-year only (single year)
    const yr = extractReleaseYear(r.year);
    columnValues['year'].add(yr || '[N/A]');

    columnValues['platform'].add(r.platform || '[N/A]');
    columnValues['imdb'].add(r.imdb || '[N/A]');
    (r.language || '[N/A]').toString().split(',').map(s => s.trim()).filter(Boolean).forEach(lang => columnValues['language'].add(lang || '[N/A]'));

    // GENRE => split into distinct values (already correct concept)
    (r.genre || '[N/A]')
      .toString()
      .split(',')
      .map(s => s.trim())
      .forEach(g => columnValues['genre'].add(g || '[N/A]'));

    columnValues['type'].add(r.type || '[N/A]');

    // totalSeasons: only meaningful for series
    const tsVal = ((r.type || '').toLowerCase() === 'series' && (r.totalSeasons || r.totalseasons))
      ? String(r.totalSeasons || r.totalseasons)
      : '[N/A]';
    columnValues['totalSeasons'].add(tsVal);
  });

  Object.keys(columnValues).forEach(k => {
    columnValues[k] = Array.from(columnValues[k]).sort((a,b)=> String(a).localeCompare(String(b)));
  });
}

/* ---------------------------
   Filtering & Rendering
   --------------------------- */
function updateHeaderIndicator(key){
  document.querySelectorAll('thead th').forEach(th=>{
    const k = th.dataset.key;
    if(k !== key) return;

    th.querySelectorAll('.active-indicator').forEach(n=> n.remove());

    const isActive =
      (key === 'imdb')
        ? (imdbFilter && imdbFilter.enabled)               // ✅ slider active
        : (activeFilters[key] && activeFilters[key].size); // ✅ normal filters

    if(isActive){
      const dot = document.createElement('span');
      dot.className = 'active-indicator';
      th.appendChild(dot);
    }
  });
}


function isDeletable(r){
  // Consider deletable if fetch explicitly failed OR the record has no useful OMDb data
  if(!r) return false;
  if(r.fetched && r.error) return true;
  const hasMeaningful = (r.poster && r.poster !== '') || (r.imdb && r.imdb !== '') || (r.plot && r.plot !== '') || (r.actors && r.actors.length);
  // if not fetched yet but no metadata -> allow delete (manual add)
  if(!r.fetched && !hasMeaningful) return true;
  // if fetched but still no meaningful data -> show delete
  if(r.fetched && !hasMeaningful) return true;
  return false;
}

function recordPassesFilters(r){
  // header filters
  for(const key of Object.keys(activeFilters)){
    if(!activeFilters[key] || activeFilters[key].size === 0) continue;
    if(key === 'genre'){
      const genres = (r.genre || '').toString().split(',').map(s=>s.trim());
      const any = Array.from(activeFilters[key]).some(v => genres.includes(v));
      if(!any) return false;
    } else if(key === 'trailer'){
      const has = r.trailer ? 'Has trailer' : '[No trailer]';
      if(!activeFilters[key].has(has)) return false;
    } else if(key === 'poster'){
      const val = r.poster ? r.poster : '[N/A]';
      if(!activeFilters[key].has(val)) return false;
    } else if(key === 'language'){
      const langs = (r.language || '').toString().split(',').map(s=>s.trim());
      const any = Array.from(activeFilters.language).some(v => langs.includes(v));
      if(!any) return false;
    } else {
      const val = (r[key] || '[N/A]').toString();
      if(!activeFilters[key].has(val)) return false;
    }
  }
  // small search
  const q = smallSearch.value.trim().toLowerCase();
  if(q){
    const hay = [r.title, r.genre, r.language, r.platform, r.year, r.imdb].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  // IMDb slider filter (drawer + popovers)
  if(imdbFilter && imdbFilter.enabled){
    const rating = parseFloat(r.imdb);
    if(Number.isNaN(rating)) return false;

    if(imdbFilter.mode === 'between'){
      if(rating < imdbFilter.min || rating > imdbFilter.max) return false;
    } else if(imdbFilter.mode === 'gte'){
      if(rating < imdbFilter.val) return false;
    } else if(imdbFilter.mode === 'lte'){
      if(rating > imdbFilter.val) return false;
    }
  }

  return true;
}

let sortAsc = true;
function sortByKey(key){
  records.sort((a,b)=>{
    const va = ((a[key] || '') + '').toString().toLowerCase();
    const vb = ((b[key] || '') + '').toString().toLowerCase();
    if(va < vb) return sortAsc ? -1 : 1;
    if(va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  sortAsc = !sortAsc;
  renderTable();
}

function renderTable(){
  resultsBody.innerHTML = '';
  const visible = [];
  let srCounter = 1;

  for(let i=0;i<records.length;i++){
    const r = records[i];
    if(!recordPassesFilters(r)) continue;

    visible.push(i);
    const tr = document.createElement('tr');
    const showActions = (!r.imdb || r.error);

    tr.innerHTML = `
      <td>${srCounter++}</td>
      <td>
        <img src="${r.poster || 'https://via.placeholder.com/150x220?text=No+Poster'}"
             class="poster-thumb" data-idx="${i}" />
      </td>

      <td style="font-weight:600;cursor:pointer;position:relative;padding-right:${showActions ? '78px' : '12px'}">
        ${escapeHtml(r.title || '')}

// ---------- Series helpers (safe) ----------
let __seriesMode = 'seasons'; // 'seasons' | 'top' | 'years'
let __currentSeasonEpisodes = [];

function seasonYearRange(episodes){
  // Episodes have Released like "17 Apr 2011" or "N/A"
  const years = (episodes || [])
    .map(ep => (ep.Released && ep.Released !== 'N/A') ? ep.Released.slice(-4) : '')
    .filter(y => /^\d{4}$/.test(y));
  if(!years.length) return '';
  const minY = Math.min(...years.map(Number));
  const maxY = Math.max(...years.map(Number));
  return (minY === maxY) ? String(minY) : `${minY}–${maxY}`;
}

function renderEpisodesGroupedByYear(episodes){
  if(!episodesList) return;
  if(!episodes || !episodes.length){
    episodesList.innerHTML = `<div class="muted">No episodes found.</div>`;
    return;
  }
  const groups = {};
  for(const ep of episodes){
    const y = (ep.Released && ep.Released !== 'N/A') ? ep.Released.slice(-4) : 'Unknown';
    if(!groups[y]) groups[y] = [];
    groups[y].push(ep);
  }
  const years = Object.keys(groups).sort((a,b)=>{
    if(a==='Unknown') return 1;
    if(b==='Unknown') return -1;
    return Number(a)-Number(b);
  });

  episodesList.innerHTML = years.map(y=>{
    const items = groups[y].map(ep=>{
      const rel = (ep.Released && ep.Released !== 'N/A') ? ep.Released : '';
      const rate = (ep.imdbRating && ep.imdbRating !== 'N/A') ? ep.imdbRating : '';
      return `
        <div style="padding:10px;border:1px solid #eef2f6;border-radius:12px;margin-top:8px;background:#fff">
          <div style="display:flex;justify-content:space-between;gap:12px">
            <div style="font-weight:700">${escapeHtml(ep.Episode || '')}. ${escapeHtml(ep.Title || '')}</div>
            <div class="muted" style="white-space:nowrap">${escapeHtml(rel)}</div>
          </div>
          <div class="muted" style="margin-top:6px">★ ${escapeHtml(rate)}</div>
        </div>
      `;
    }).join('');
    return `
      <div style="margin-top:14px">
        <div style="font-weight:800">${escapeHtml(y)}</div>
        ${items}
      </div>
    `;
  }).join('');
}

async function loadSeasonForDetail(imdbID, seasonNum){
  const key = apiKeyInput.value.trim() || DEFAULT_OMDB_KEY;
  if(!key) return;

  if(!episodesList) return;
  episodesList.innerHTML = `<div class="muted">Loading Season ${seasonNum}…</div>`;

  try{
    const data = await fetchOneOMDb(key, { imdbID, season: seasonNum });
    if(!data || data.Response !== 'True'){
      episodesList.innerHTML = `<div class="muted">Could not load Season ${seasonNum} (${escapeHtml(data?.Error || 'Not found')}).</div>`;
      __currentSeasonEpisodes = [];
      return;
    }

    __currentSeasonEpisodes = (data.Episodes || []).map(ep => ({
      Title: ep.Title || '',
      Released: ep.Released || '',
      Episode: ep.Episode || '',
      imdbRating: ep.imdbRating || '',
      imdbID: ep.imdbID || ''
    }));

    const yr = seasonYearRange(__currentSeasonEpisodes);
    if(seasonHint) seasonHint.textContent = yr ? `Season ${seasonNum} • ${yr}` : `Season ${seasonNum}`;

    // Render based on current mode
    if(__seriesMode === 'top'){
      renderEpisodes(sortEpisodesTopRated(__currentSeasonEpisodes));
    } else if(__seriesMode === 'years'){
      renderEpisodesGroupedByYear(__currentSeasonEpisodes);
    } else {
      renderEpisodes(__currentSeasonEpisodes);
    }

  } catch(err){
    episodesList.innerHTML = `<div class="muted">Season load failed: ${escapeHtml(err.message || String(err))}</div>`;
    __currentSeasonEpisodes = [];
  }
}

function navigateDetail(delta){
  if(!lastVisibleIndices || lastVisibleIndices.length === 0 || currentDetailIndex === null) return;
  const pos = lastVisibleIndices.indexOf(currentDetailIndex);
  if(pos === -1) return;
  let nextPos = pos + delta;
  if(nextPos < 0) nextPos = lastVisibleIndices.length - 1;
  if(nextPos >= lastVisibleIndices.length) nextPos = 0;
  const nextIdx = lastVisibleIndices[nextPos];
  openDetailForIndex(nextIdx);
}

   Wikipedia actor image lookup
   --------------------------- */
async function fetchActorImageWikipedia(actorName){
  const sUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(actorName)}&utf8=&format=json&origin=*`;
  const sRes = await fetch(sUrl);
  if(!sRes.ok) return null;
  const sJson = await sRes.json();
  if(!sJson.query || !sJson.query.search || sJson.query.search.length === 0) return null;
  const title = sJson.query.search[0].title;
  const pUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=200&origin=*`;
  const pRes = await fetch(pUrl);
  if(!pRes.ok) return null;
  const pJson = await pRes.json();
  const pages = pJson.query && pJson.query.pages ? pJson.query.pages : null;
  if(!pages) return null;
  const page = Object.values(pages)[0];
  if(page && page.thumbnail && page.thumbnail.source) return page.thumbnail.source;
  return null;
}

    border:1px solid rgba(229,231,235,.8);
    cursor:pointer;
  }
  .title-cell{font-weight:900;cursor:pointer}

  /* Scrim (click outside to close) */
  .scrim{
    position:fixed;inset:0;
    background:rgba(15,23,42,.28);
    backdrop-filter: blur(6px);
    z-index:110;
    display:none;
  }
  .scrim.show{display:block}

  /* Detail drawer */
  .detail-panel{
    position:fixed;top:0;right:0;width:100%;max-width:880px;height:100%;
    background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.18);
    transform:translateX(110%);
    transition:transform .36s cubic-bezier(.2,.9,.3,1);
    z-index:120; overflow:auto;
    border-left:1px solid rgba(229,231,235,.8);
  }
  .detail-panel.open{transform:translateX(0%)}
  .detail-header{
    display:flex;align-items:center;gap:12px;padding:18px;
    border-bottom:1px solid rgba(229,231,235,.8);
    position:sticky;top:0;background:rgba(255,255,255,.92);
    z-index:10;backdrop-filter:saturate(180%) blur(12px);
  }
  .nav-arrow{
    width:44px;height:44px;border-radius:14px;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;border:1px solid rgba(229,231,235,.9);
    background:#fff;font-weight:900;
  }
  .detail-poster{
    width:260px;height:390px;object-fit:cover;border-radius:16px;
    border:1px solid rgba(229,231,235,.9);
  }
  .detail-title{margin:0;font-size:22px;font-weight:900}
  .chiprow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{
    padding:8px 10px;border-radius:999px;
    border:1px solid rgba(229,231,235,.9);
    background:#fff;font-weight:900;font-size:13px;
  }
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  a.btnlink{
    background:var(--accent);color:#fff;padding:10px 14px;border-radius:14px;
    display:inline-flex;gap:8px;align-items:center;
    text-decoration:none;font-weight:900;
  }
  a.btnlink.secondary{
    background:#fff;color:var(--text);
    border:1px solid var(--border);
  }

  /* Filter drawer */
  .filter-drawer{
    position:fixed;top:0;right:0;height:100%;width:380px;max-width:95%;
    background:#fff;box-shadow:-18px 0 40px rgba(2,6,23,0.14);
    transform:translateX(110%);
    transition:transform .32s cubic-bezier(.2,.9,.3,1);
    z-index:140;padding:18px;overflow:auto;
    border-left:1px solid rgba(229,231,235,.8);
  }
  .filter-drawer.open{transform:translateX(0%)}
  .filter-drawer h3{margin:0 0 10px 0;font-size:18px;font-weight:900}
  .section{margin-bottom:14px}
  .section strong{display:block;margin-bottom:8px}
  .chk{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .chk input{transform:scale(1.05)}
  .drawer-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

  /* Seasons (IMDB-like tabs + list) */
  .seg{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;
  }
  .segbtn{
    padding:10px 12px;border-radius:14px;border:1px solid rgba(229,231,235,.9);
    background:#fff;font-weight:900;cursor:pointer;
  }
  .segbtn.active{border-color:rgba(0,122,255,.35); box-shadow:0 0 0 4px rgba(0,122,255,.10)}
  .seasonRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .seasonChip{
    width:48px;height:48px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid rgba(229,231,235,.9);
    background:#fff;font-weight:900;cursor:pointer;
  }
  .seasonChip.active{
    border-color:rgba(0,122,255,.35);
    box-shadow:0 0 0 4px rgba(0,122,255,.12)
  }
  .episodeCard{
    display:flex;gap:14px;align-items:flex-start;
    padding:14px;border:1px solid rgba(229,231,235,.9);
    border-radius:16px;background:#fff;margin-top:10px;
  }
  .epThumb{
    width:160px;height:90px;border-radius:14px;object-fit:cover;
    border:1px solid rgba(229,231,235,.9);
    background:#f3f4f6;
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 12px;border-radius:999px;
    background:#FBBF24;color:#111;font-weight:900;
    letter-spacing:.2em;text-transform:uppercase;font-size:12px;
  }
  .epTitle{font-weight:900;font-size:18px;line-height:1.2}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>MovieDB — Shared View</h1>
      <div class="muted">View-only file (filters + detail drawer). No uploads / fetch / exports.</div>
    </div>
    <div class="controls">
      <button id="openFilters" class="btn secondary">⚙️ Filters</button>
      <input id="smallSearch" class="pill" style="width:220px" placeholder="Search..." />
      <button id="btnReset" class="btn secondary">Reset</button>
    </div>
  </header>

  <div class="wrap">
    <div style="overflow-x:auto">
      <table id="resultsTable">
        <thead>
          <tr>
            <th data-key="poster" style="cursor:default">Poster</th>
            <th data-key="title">Title</th>
            <th data-key="year">Year</th>
            <th data-key="platform">Platform</th>
            <th data-key="imdb">IMDb</th>
            <th data-key="language">Language</th>
            <th data-key="genre">Genre</th>
            <th data-key="type">Type</th>
            <th data-key="trailer" style="cursor:default">Trailer</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- scrims -->
<div id="detailScrim" class="scrim"></div>
<div id="filterScrim" class="scrim"></div>

<!-- DETAIL DRAWER -->
<div id="detailPanel" class="detail-panel" aria-hidden="true">
  <div class="detail-header">
    <div style="display:flex;gap:8px;align-items:center">
      <div id="prevBtn" class="nav-arrow">◀</div>
      <div id="nextBtn" class="nav-arrow">▶</div>
    </div>
    <div style="flex:1"></div>
    <button id="closeDetail" class="btn secondary">Close</button>
  </div>

  <div style="padding:18px">
    <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
      <img id="detailPoster" class="detail-poster" src="" alt="poster"/>
      <div style="flex:1;min-width:260px">
        <h2 id="detailTitle" class="detail-title"></h2>
        <div id="detailMeta" class="muted" style="margin-top:8px"></div>
        <p id="detailPlot" style="margin-top:12px;line-height:1.45"></p>

        <div id="actorRow" class="chiprow"></div>

        <div class="btnrow">
          <a id="detailTrailer" class="btnlink" target="_blank" rel="noopener">▶ YouTube Trailer</a>
          <a id="detailWiki" class="btnlink secondary" target="_blank" rel="noopener">Wikipedia</a>
        </div>

        <!-- Seasons / Episodes -->
        <div id="seriesBlock" style="margin-top:18px;display:none">
          <div class="muted" id="seriesMeta"></div>

          <div class="seg">
            <button id="btnSeasons" class="segbtn active">Seasons</button>
            <button id="btnYears" class="segbtn">Years</button>
            <button id="btnTopRated" class="segbtn">Top-rated</button>
          </div>

          <div id="seasonRow" class="seasonRow"></div>
          <div id="episodesList" style="margin-top:6px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FILTER DRAWER -->
<div id="filterDrawer" class="filter-drawer" aria-hidden="true">
  <h3>Filters</h3>

  <div class="section">
    <div class="muted" style="margin-bottom:8px">Search inside filter options</div>
    <input id="drawerSearch" class="pill" style="width:100%" placeholder="Filter options..." />
  </div>

  <div class="section">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button id="clearAllDrawer" class="btn secondary">Clear</button>
    </div>
    <div id="drawerContent"></div>
  </div>

  <div class="drawer-actions">
    <button id="closeDrawer" class="btn secondary">Close</button>
  </div>
</div>

<script>
  const records = ${recordsJson};

  const columnKeys = ['poster','title','year','platform','imdb','language','genre','type','trailer'];
  let activeFilters = {};     // key -> Set
  let lastVisibleIndices = [];
  let currentDetailIndex = null;
  let sortAsc = true;

  const resultsBody = document.getElementById('resultsBody');
  const smallSearch = document.getElementById('smallSearch');
  const btnReset = document.getElementById('btnReset');

  const detailPanel = document.getElementById('detailPanel');
  const detailScrim = document.getElementById('detailScrim');
  const detailPoster = document.getElementById('detailPoster');
  const detailTitle = document.getElementById('detailTitle');
  const detailMeta = document.getElementById('detailMeta');
  const detailPlot = document.getElementById('detailPlot');
  const actorRow = document.getElementById('actorRow');
  const detailTrailer = document.getElementById('detailTrailer');
  const detailWiki = document.getElementById('detailWiki');
  const closeDetail = document.getElementById('closeDetail');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  const openFilters = document.getElementById('openFilters');
  const filterDrawer = document.getElementById('filterDrawer');
  const filterScrim = document.getElementById('filterScrim');
  const drawerContent = document.getElementById('drawerContent');
  const drawerSearch = document.getElementById('drawerSearch');
  const clearAllDrawer = document.getElementById('clearAllDrawer');
  const closeDrawer = document.getElementById('closeDrawer');

  // Series UI refs
  const seriesBlock = document.getElementById('seriesBlock');
  const seriesMeta = document.getElementById('seriesMeta');
  const seasonRow = document.getElementById('seasonRow');
  const episodesList = document.getElementById('episodesList');
  const btnSeasons = document.getElementById('btnSeasons');
  const btnYears = document.getElementById('btnYears');
  const btnTopRated = document.getElementById('btnTopRated');

  // OMDb (only used for episodes when imdbID exists)
  const DEFAULT_OMDB_KEY = '6914a6cb';

  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);
    });
  }
  function escapeAttr(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/"/g,'&quot;');
  }

  function canonical(s){ return String(s||'').trim().replace(/\\s+/g,' ').toLowerCase(); }
  function splitCSV(s){ return String(s||'').split(',').map(x=>x.trim()).filter(Boolean); }
  function releaseYear(y){
    const m = String(y||'').match(/(\\d{4})/);
    return m ? m[1] : '';
  }
  function isImdbId(x){ return typeof x === 'string' && /^tt\\d{5,}$/.test(x.trim()); }

  function fetchOneOMDb(key, opts){
    let url = 'https://www.omdbapi.com/?apikey=' + encodeURIComponent(key) + '&plot=short&r=json';
    if(opts && opts.imdbID){
      url += '&i=' + encodeURIComponent(opts.imdbID);
      if(opts.season) url += '&Season=' + encodeURIComponent(opts.season);
      if(opts.episode) url += '&Episode=' + encodeURIComponent(opts.episode);
    } else {
      url += '&t=' + encodeURIComponent((opts && opts.title) ? opts.title : '');
    }
    return fetch(url).then(r=>r.json());
  }

  // ---------------------------
  // 1) FILTERS
  // ---------------------------
  function recordPassesFilters(r){
    for(const key of Object.keys(activeFilters)){
      const set = activeFilters[key];
      if(!set || set.size===0) continue;

      if(key === 'genre'){
        // single-select genre (radio) stored as Set([v])
        const chosen = Array.from(set)[0];
        if(!chosen) continue;
        const genres = splitCSV(r.genre);
        if(!genres.includes(chosen)) return false;

      } else if(key === 'language'){
        // language split
        const langs = splitCSV(r.language);
        const any = Array.from(set).some(v => langs.includes(v));
        if(!any) return false;

      } else if(key === 'platform'){
        // platform normalize (case-insensitive match)
        const tok = canonical(r.platform);
        const ok = Array.from(set).some(v => canonical(v) === tok);
        if(!ok) return false;

      } else if(key === 'year'){
        const y = releaseYear(r.year) || '[N/A]';
        if(!set.has(y)) return false;

      } else if(key === 'trailer'){
        const has = r.trailer ? 'Has trailer' : '[No trailer]';
        if(!set.has(has)) return false;

      } else if(key === 'poster'){
        const val = r.poster ? '[Has poster]' : '[No poster]';
        if(!set.has(val)) return false;

      } else if(key === 'language'){
        const langs = (r.language || '').toString().split(',').map(s=>s.trim()).filter(Boolean);
        const any = Array.from(set).some(v => langs.includes(v));
        if(!any) return false;
      } else {
        const val = (r[key] || '[N/A]').toString();
        if(!set.has(val)) return false;
      }
    }

    const q = (smallSearch.value || '').trim().toLowerCase();
    if(q){
      const hay = [r.title, r.genre, r.language, r.platform, r.year, r.imdb, r.type].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }

  function renderTable(){
    resultsBody.innerHTML = '';
    const visible = [];
    let srCounter = 1;

    for(let i=0;i<records.length;i++){
      const r = records[i];
      if(!recordPassesFilters(r)) continue;

      visible.push(i);

      const tr = document.createElement('tr');
      const posterSrc = r.poster || 'https://via.placeholder.com/300x450?text=No+Poster';

      tr.innerHTML =
        '<td>' + (srCounter++) + '</td>' +
        '<td><img src="' + escapeAttr(posterSrc) + '" class="poster-thumb" /></td>' +
        '<td class="title-cell">' + escapeHtml(r.title || '') + (r.imdbID ? '<div class="muted">IMDb ID: ' + escapeHtml(r.imdbID) + '</div>' : '') + '</td>' +
        '<td>' + escapeHtml(releaseYear(r.year) || r.year || '') + '</td>' +
        '<td>' + escapeHtml((r.platform || '')) + '</td>' +
        '<td>' + escapeHtml((r.imdb || '')) + '</td>' +
        '<td>' + escapeHtml((r.language || '')) + '</td>' +
        '<td>' + escapeHtml((r.genre || '')) + '</td>' +
        '<td>' + escapeHtml((r.type || '')) + '</td>' +
        '<td>' + (((r.type || '').toLowerCase() === 'series' && r.totalSeasons) ? escapeHtml(String(r.totalSeasons)) : '') + '</td>';

      tr.querySelector('img.poster-thumb').addEventListener('click', function(e){
        e.stopPropagation();
        openDetailForIndex(i);
      });
      tr.querySelector('.title-cell').addEventListener('click', function(){
        openDetailForIndex(i);
      });

      resultsBody.appendChild(tr);
    }

    lastVisibleIndices = visible;
  }

  // ---------------------------
  // 2) DETAIL DRAWER (actors + trailer + wiki + seasons)
  // ---------------------------
  let __seriesMode = 'seasons';
  let __currentSeasonEpisodes = [];
  let __currentImdbID = '';
  let __currentTotalSeasons = 0;
  let __currentSeason = 1;

  function setSeriesMode(mode){
    __seriesMode = mode;
    btnSeasons.classList.toggle('active', mode==='seasons');
    btnYears.classList.toggle('active', mode==='years');
    btnTopRated.classList.toggle('active', mode==='top');

    if(mode==='top') renderEpisodes(sortEpisodesTopRated(__currentSeasonEpisodes), true);
    else if(mode==='years') renderEpisodesGroupedByYear(__currentSeasonEpisodes);
    else renderEpisodes(__currentSeasonEpisodes, false);
  }

  function openDetailForIndex(idx){
    currentDetailIndex = idx;
    const rec = records[idx] || {};

    const posterSrc = rec.poster || 'https://via.placeholder.com/300x450?text=No+Poster';
    detailPoster.src = posterSrc;
    detailTitle.textContent = rec.title || 'Untitled';
    detailMeta.textContent =
      (releaseYear(rec.year) || rec.year || '') +
      ' • ' + (rec.platform || '') +
      ' • ★ ' + (rec.imdb || '') +
      ' • ' + (rec.language || '');

    detailPlot.textContent = rec.plot || 'No description available.';

    // Actors (max 6)
    const actors = Array.isArray(rec.actors) ? rec.actors.slice(0,6) : [];
    actorRow.innerHTML = actors.length
      ? actors.map(a => '<span class="chip">' + escapeHtml(a) + '</span>').join('')
      : '<span class="muted">No actor data</span>';

    // Trailer: prefer saved link else YouTube search
    const ytQ = encodeURIComponent(((rec.title||'') + ' official trailer').trim());
    const ytUrl = 'https://www.youtube.com/results?search_query=' + ytQ;
    detailTrailer.href = (rec.trailer && String(rec.trailer).trim()) ? rec.trailer : ytUrl;

    // Wikipedia search link (no fetch)
    const wikiQ = encodeURIComponent((rec.title || '').trim());
    detailWiki.href = 'https://en.wikipedia.org/wiki/Special:Search?search=' + wikiQ;

    // Series block
    const imdbID = String(rec.imdbID || '').trim();
    const isSeries = String(rec.type || '').toLowerCase() === 'series';
    const totalSeasons = parseInt(rec.totalSeasons || '', 10) || 0;

    if(isSeries && isImdbId(imdbID) && totalSeasons > 0){
      seriesBlock.style.display = '';
      seriesMeta.textContent = 'Seasons & Episodes (via OMDb) • IMDb ID: ' + imdbID + ' • Total Seasons: ' + totalSeasons;

      __currentImdbID = imdbID;
      __currentTotalSeasons = totalSeasons;
      __currentSeason = 1;
      __currentSeasonEpisodes = [];

      // Season circles like IMDb
      seasonRow.innerHTML = '';
      for(let s=1; s<=totalSeasons; s++){
        const chip = document.createElement('button');
        chip.className = 'seasonChip' + (s===1 ? ' active' : '');
        chip.textContent = String(s);
        chip.addEventListener('click', function(){
          __currentSeason = s;
          Array.from(seasonRow.querySelectorAll('.seasonChip')).forEach(b => b.classList.remove('active'));
          chip.classList.add('active');
          loadSeason(imdbID, s);
        });
        seasonRow.appendChild(chip);
      }

      btnSeasons.onclick = function(){ setSeriesMode('seasons'); };
      btnYears.onclick   = function(){ setSeriesMode('years'); };
      btnTopRated.onclick= function(){ setSeriesMode('top'); };

      setSeriesMode('seasons');
      loadSeason(imdbID, 1);

    } else {
      seriesBlock.style.display = 'none';
      seasonRow.innerHTML = '';
      episodesList.innerHTML = '';
    }

    // open drawer + scrim
    detailScrim.classList.add('show');
    detailPanel.classList.add('open');
    detailPanel.setAttribute('aria-hidden','false');
  }

  function closeDetailPanel(){
    detailPanel.classList.remove('open');
    detailPanel.setAttribute('aria-hidden','true');
    detailScrim.classList.remove('show');
  }

  function navigateDetail(delta){
    if(!lastVisibleIndices.length || currentDetailIndex === null) return;
    const pos = lastVisibleIndices.indexOf(currentDetailIndex);
    if(pos === -1) return;
    let nextPos = pos + delta;
    if(nextPos < 0) nextPos = lastVisibleIndices.length - 1;
    if(nextPos >= lastVisibleIndices.length) nextPos = 0;
    openDetailForIndex(lastVisibleIndices[nextPos]);
  }

  // Seasons/Episodes
  async function loadSeason(imdbID, seasonNum){
    episodesList.innerHTML = '<div class="muted">Loading Season ' + seasonNum + '…</div>';
    try{
      const data = await fetchOneOMDb(DEFAULT_OMDB_KEY, { imdbID: imdbID, season: seasonNum });
      if(!data || data.Response !== 'True'){
        episodesList.innerHTML = '<div class="muted">Could not load Season ' + seasonNum + '.</div>';
        __currentSeasonEpisodes = [];
        return;
      }

      __currentSeasonEpisodes = (data.Episodes || []).map(function(ep){
        return {
          Title: ep.Title || '',
          Released: ep.Released || '',
          Episode: ep.Episode || '',
          imdbRating: ep.imdbRating || '',
          imdbID: ep.imdbID || ''
        };
      });

      if(__seriesMode==='top') renderEpisodes(sortEpisodesTopRated(__currentSeasonEpisodes), true);
      else if(__seriesMode==='years') renderEpisodesGroupedByYear(__currentSeasonEpisodes);
      else renderEpisodes(__currentSeasonEpisodes, false);

    }catch(err){
      episodesList.innerHTML = '<div class="muted">Season load failed.</div>';
      __currentSeasonEpisodes = [];
    }
  }

  function sortEpisodesTopRated(episodes){
    return (episodes || []).slice().sort(function(a,b){
      const ra = parseFloat(a.imdbRating), rb = parseFloat(b.imdbRating);
      if(isNaN(ra) && isNaN(rb)) return 0;
      if(isNaN(ra)) return 1;
      if(isNaN(rb)) return -1;
      return rb - ra;
    });
  }

  function renderEpisodes(episodes, showTopBadge){
    if(!episodes || !episodes.length){
      episodesList.innerHTML = '<div class="muted">No episodes found.</div>';
      return;
    }

    const seriesPosterThumb = detailPoster.src || 'https://via.placeholder.com/300x450?text=No+Poster';

    episodesList.innerHTML = episodes.map(function(ep, idx){
      const rate = (ep.imdbRating && ep.imdbRating !== 'N/A') ? ep.imdbRating : '';
      const rel = (ep.Released && ep.Released !== 'N/A') ? ep.Released : '';

      // Top badge only for first item in Top-rated mode
      const badge = (showTopBadge && idx===0) ? '<div class="badge">TOP-RATED</div>' : '';

      const titleLine = 'S' + __currentSeason + '.E' + escapeHtml(ep.Episode) + ' - ' + escapeHtml(ep.Title);

      return ''
        + '<div class="episodeCard">'
        +   '<img class="epThumb" src="' + escapeAttr(seriesPosterThumb) + '" alt="ep" />'
        +   '<div style="flex:1;min-width:220px">'
        +     badge
        +     '<div class="epTitle" style="margin-top:' + (badge ? '10px' : '0') + '">' + titleLine + '</div>'
        +     '<div class="muted" style="margin-top:8px">★ ' + escapeHtml(rate) + '</div>'
        +   '</div>'
        +   '<div class="muted" style="white-space:nowrap">' + escapeHtml(rel) + '</div>'
        + '</div>';
    }).join('');
  }

  function renderEpisodesGroupedByYear(episodes){
    if(!episodes || !episodes.length){
      episodesList.innerHTML = '<div class="muted">No episodes found.</div>';
      return;
    }

    const groups = {};
    episodes.forEach(function(ep){
      const y = (ep.Released && ep.Released !== 'N/A') ? ep.Released.slice(-4) : 'Unknown';
      if(!groups[y]) groups[y] = [];
      groups[y].push(ep);
    });

    const years = Object.keys(groups).sort(function(a,b){
      if(a==='Unknown') return 1;
      if(b==='Unknown') return -1;
      return Number(a)-Number(b);
    });

    const seriesPosterThumb = detailPoster.src || 'https://via.placeholder.com/300x450?text=No+Poster';

    episodesList.innerHTML = years.map(function(y){
      const items = groups[y].map(function(ep){
        const rate = (ep.imdbRating && ep.imdbRating !== 'N/A') ? ep.imdbRating : '';
        const rel = (ep.Released && ep.Released !== 'N/A') ? ep.Released : '';
        const titleLine = 'S' + __currentSeason + '.E' + escapeHtml(ep.Episode) + ' - ' + escapeHtml(ep.Title);

        return ''
          + '<div class="episodeCard">'

  function buildDrawerOptions(){

  function makeCheckboxSection(label, key, items){
    const wrap = document.createElement('div');

    items.forEach(function(v){
      const lab = document.createElement('label');
      lab.className = 'chk';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.key = key;
      cb.value = v;

      if(activeFilters[key] && activeFilters[key].has(v)) cb.checked = true;

      const sp = document.createElement('span');
      sp.textContent = v;

      lab.appendChild(cb);
      lab.appendChild(sp);
      wrap.appendChild(lab);
    });

    return sectionBlock(label, wrap);
  }

  function makeRadioSection(label, key, items){
    const wrap = document.createElement('div');

    const current = (activeFilters[key] && activeFilters[key].size)
      ? Array.from(activeFilters[key])[0]
      : null;

    // "All" option
    {
      const lab = document.createElement('label');
      lab.className = 'chk';
      const rb = document.createElement('input');
      rb.type = 'radio';
      rb.name = 'radio_' + key;
      rb.dataset.key = key;
      rb.value = '__ALL__';
      rb.checked = !current;
      const sp = document.createElement('span');
      sp.textContent = 'All';
      lab.appendChild(rb); lab.appendChild(sp);
      wrap.appendChild(lab);
    }

    items.forEach(function(v){
      const lab = document.createElement('label');
      lab.className = 'chk';

      const rb = document.createElement('input');
      rb.type = 'radio';
      rb.name = 'radio_' + key;
      rb.dataset.key = key;
      rb.value = v;
      rb.checked = (current === v);

      const sp = document.createElement('span');
      sp.textContent = v;

      lab.appendChild(rb);
      lab.appendChild(sp);
      wrap.appendChild(lab);
    });

    return sectionBlock(label, wrap);
  }

  function sectionBlock(title, contentNode){
    const sec = document.createElement('div');
    sec.className = 'section';
    const h = document.createElement('strong');
    h.textContent = title;
    sec.appendChild(h);
    sec.appendChild(contentNode);
    return sec;
  }

    if(filterDrawer.classList.contains('open')) buildDrawerOptions();
  }

  // Auto-apply: update activeFilters on any change inside the drawer
  function onDrawerChange(e){
    const t = e.target;
    if(!t) return;

    const key = t.dataset ? t.dataset.key : null;
    if(!key) return;

    // checkbox
    if(t.type === 'checkbox'){
      if(!activeFilters[key]) activeFilters[key] = new Set();
      if(t.checked) activeFilters[key].add(t.value);
      else activeFilters[key].delete(t.value);
      if(activeFilters[key].size === 0) delete activeFilters[key];
      renderTable();
      return;
    }

    // radio (genre single)
    if(t.type === 'radio'){
      if(t.value === '__ALL__'){
        delete activeFilters[key];
      } else {
        activeFilters[key] = new Set([t.value]);
      }
      renderTable();
      return;
    }
  }

  function clearAllInDrawer(){
    activeFilters = {};
    renderTable();
    buildDrawerOptions();
  }

  // ---------------------------
  // 4) SORT
  // ---------------------------
  function sortByKey(key){
    // skip non-sort columns
    if(key === 'poster' || key === 'trailer') return;

    records.sort(function(a,b){
      const va = String(a[key] || '').toLowerCase();
      const vb = String(b[key] || '').toLowerCase();
      if(va < vb) return sortAsc ? -1 : 1;
      if(va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
    sortAsc = !sortAsc;
    renderTable();
  }

  // ---------------------------
  // 5) EVENTS
  // ---------------------------
  smallSearch.addEventListener('input', renderTable);
  btnReset.addEventListener('click', resetFilters);

  openFilters.addEventListener('click', function(){ toggleFilterDrawer(true); });
  closeDrawer.addEventListener('click', function(){ toggleFilterDrawer(false); });

      if(e.key === 'ArrowRight') navigateDetail(1);

  // header sort

      if(key) sortByKey(key);
    });
  });

  // Init
  renderTable();
${CLOSE_SCRIPT}
</body>

function downloadStandaloneHTML(rows){
  try{
    const data = (rows || records).map(r => ({
      title: r.title||'',
      year: r.year||'',
      platform: r.platform||'',
      imdb: r.imdb||'',
      language: r.language||'',
      genre: r.genre||'',
      type: r.type||'',
      plot: r.plot||'',
      poster: r.poster||'',
      trailer: r.trailer||''
    }));

    const html = buildStandaloneHTML(data);

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'MovieDB_SharedView.html';
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);

    setTimeout(() => {
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
      }, 4000);
    }, 50);

  } catch (err) {
    console.error(err);
    alert('Download failed: ' + err.message);

    // fallback
    try{
      const html = buildStandaloneHTML(rows || records);
      const w = window.open();
      if(w){
        w.document.open();
        w.document.write(html);
        w.document.close();
      }
    } catch(e2){
      console.error(e2);
    }
  }
}

function youtubeEmbedUrl(urlOrId){
  const raw = (typeof urlOrId === 'string') ? urlOrId.trim() : '';

  if(!raw) return '';

  if(raw.includes('youtube.com') || raw.includes('youtu.be')){
    try{
      if(raw.includes('youtu.be/')){
        const id = raw.split('youtu.be/')[1].split(/[?&]/)[0];
        return `https://www.youtube.com/embed/${id}`;
      }
      const u = new URL(raw);
      const id = u.searchParams.get('v');
      if(id) return `https://www.youtube.com/embed/${id}`;
    }catch(e){}
  }

  if(/^[a-zA-Z0-9_-]{6,20}$/.test(raw)) {
    return `https://www.youtube.com/embed/${raw}`;
  }

  return '';
}

    card.style.padding = '8px 10px';
    card.style.border = '1px solid #e6edf3';
    card.style.borderRadius = '12px';
    card.style.background = '#fff';

    const img = document.createElement('img');
    img.src = 'https://via.placeholder.com/56x56?text=...';
    img.alt = name;
    img.style.width = '56px';
    img.style.height = '56px';
    img.style.objectFit = 'cover';
    img.style.borderRadius = '10px';
    img.style.border = '1px solid #eef2f6';

    const txt = document.createElement('div');
    txt.style.fontWeight = '600';
    txt.style.fontSize = '13px';
    txt.textContent = name;

    card.appendChild(img);
    card.appendChild(txt);
    actorRow.appendChild(card);

    // thumbnail lookup with cache
    if(cache[name]){
      img.src = cache[name];
      continue;
    }

    try{
      const thumb = await fetchActorImageWikipedia(name);
      if(thumb){
        img.src = thumb;
        cache[name] = thumb;
        sessionStorage.setItem(cacheKey, JSON.stringify(cache));
      } else {
        img.src = 'https://via.placeholder.com/56x56?text=?';
      }
    } catch(e){
      img.src = 'https://via.placeholder.com/56x56?text=?';
    }
  }
}
function isImdbId(x){
  return typeof x === 'string' && /^tt\d{5,}$/.test(x.trim());
}

function normalizeImdbId(rec){
  // accept imdbID / imdb_id / imdbId and always keep in rec.imdbID
  const raw = (rec.imdbID || rec.imdb_id || rec.imdbId || '').toString().trim();
  if(/^tt\d{4,}$/.test(raw)){
    rec.imdbID = raw;
    rec.imdb_id = raw; // keep compat (optional)
    rec.imdbId = raw;  // keep compat (optional)
  } else {
    // if invalid, clear only canonical so you don't keep junk
    rec.imdbID = (rec.imdbID || '').toString().trim();
  }
  return rec.imdbID;
}

function fetchOneOMDbById(key, imdbID){
  const url = `https://www.omdbapi.com/?apikey=${encodeURIComponent(key)}&i=${encodeURIComponent(imdbID)}&plot=short&r=json`;
  return fetch(url).then(r => r.json());
}

// Fetch + update ONLY ONE record (by imdbID if available, else by title)
async function fetchAndUpdateOneRecord(rec){
  const key = apiKeyInput.value.trim() || DEFAULT_OMDB_KEY;
  if(!key) { alert('OMDb key missing'); return; }

  try{
    let data = null;

    // ✅ Prefer IMDb ID (support both imdbID and imdb_id)
    const imdbId = String(rec.imdbID || rec.imdb_id || '').trim();

    if(isImdbId(imdbId)){
      // use the SAME signature your codebase expects: object
      data = await fetchOneOMDb(key, { imdbID: imdbId });
    }

    // ✅ Fallback to title ONLY if IMDb fetch failed
    if(!data || data.Response !== 'True'){
      const title = String(rec.title || '').trim();
      if(!title) { alert('No Title or IMDb ID to fetch.'); return; }
      data = await fetchOneOMDb(key, { title });
    }

    if(data && data.Response === 'True'){
      // (optional but recommended) if OMDb gives a better title, keep it
      if(data.Title && String(data.Title).trim()){
        rec.title = String(data.Title).trim();
      }

      rec.year = data.Year || '';
      rec.imdb = (data.imdbRating && data.imdbRating !== 'N/A') ? data.imdbRating : '';
      rec.language = data.Language || '';
      rec.genre = data.Genre || '';
      rec.type = (data.Type || '').toLowerCase();
      rec.plot = data.Plot || '';
      rec.poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : '';
      rec.actors = data.Actors ? data.Actors.split(',').map(a=>a.trim()).filter(Boolean) : [];

      // ✅ persist IMDb ID + seasons
      rec.imdbID = data.imdbID || imdbId || '';
      rec.imdb_id = rec.imdbID; // keep both in sync
      rec.totalSeasons = data.totalSeasons || rec.totalSeasons || '';

      rec.fetched = true;
      rec.error = null;
    } else {
      rec.fetched = true;
      rec.error = (data && data.Error) ? data.Error : 'Not found';
    }

    await addOrUpdateMovie(rec);  // ✅ updates same row because rec.id exists
    await refreshRecords();

  } catch(err){
    console.error(err);
    alert('Fetch failed: ' + (err.message || err));
  }
}

async function fetchSeriesSeasonList(key, imdbID, seasonNum){
  const data = await fetchOneOMDb(key, { imdbID, season: seasonNum });
  if(!data || data.Response !== 'True') return null;
  // data.Episodes is an array: Title, Released, Episode, imdbRating, imdbID
  return data;
}

function renderEpisodes(episodes){
  // episodes = array of {Title, Released, Episode, imdbRating, imdbID}
  if(!episodes || !episodes.length){
    episodesList.innerHTML = `<div class="muted">No episodes found.</div>`;
    return;
  }

  episodesList.innerHTML = episodes.map(ep => {
    const rate = (ep.imdbRating && ep.imdbRating !== 'N/A') ? ep.imdbRating : '';
    const rel = (ep.Released && ep.Released !== 'N/A') ? ep.Released : '';
    return `
      <div style="padding:12px; border:1px solid #eef2f6; border-radius:12px; margin-bottom:10px; background:#fff">
        <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start">
          <div style="font-weight:700">
            S${escapeHtml(seasonSelect.value)}.E${escapeHtml(ep.Episode)} — ${escapeHtml(ep.Title || '')}
          </div>
          <div class="muted" style="white-space:nowrap">${escapeHtml(rel)}</div>
        </div>
        <div class="muted" style="margin-top:6px">★ ${escapeHtml(rate)}</div>
      </div>
    `;
  }).join('');
}

function sortEpisodesTopRated(episodes){
  return [...episodes].sort((a,b)=>{
    const ra = parseFloat(a.imdbRating); const rb = parseFloat(b.imdbRating);
    if(isNaN(ra) && isNaN(rb)) return 0;
    if(isNaN(ra)) return 1;
    if(isNaN(rb)) return -1;
    return rb - ra;
  });
}

function groupEpisodesByYear(episodes){
  const map = {};
  (episodes||[]).forEach(ep=>{
    const y = (ep.Released && ep.Released !== 'N/A') ? ep.Released.slice(-4) : 'Unknown';
    if(!map[y]) map[y] = [];
    map[y].push(ep);
  });
  return map;
}
function extractReleaseYear(y){
  // OMDb sometimes returns: "2022–2025" or "2022–" for series
  const s = String(y || '').trim();
  const m = s.match(/\b(19|20)\d{2}\b/);
  return m ? m[0] : (s || '[N/A]');
}
