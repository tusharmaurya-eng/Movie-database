<script>
/* ===== Ver37 Railway backend adapter + IMDb direct MP4 refresh =====
   - Uses Railway/Express JSON database when served over http(s)
   - Keeps IndexedDB behavior when opened as local file://
   - Refresh IMDb Trailer button calls /api/trailers/refresh and saves latest direct MP4 URL
*/
(function(){
  const canUseBackend = location.protocol === 'http:' || location.protocol === 'https:';
  if(!canUseBackend) return;

  async function apiFetch(url, options){
    const res = await fetch(url, options || {});
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const msg = (data && (data.error || data.message)) ? (data.error || data.message) : ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return data;
  }

  async function apiGetMovies(){
    const data = await apiFetch('/api/movies');
    return Array.isArray(data) ? data : [];
  }

  // Override data functions so all edits/uploads/trailer saves persist to Railway backend.
  window.getAllMovies = getAllMovies = async function(){
    try{ return await apiGetMovies(); }
    catch(err){ console.warn('Backend getAllMovies failed; falling back to IndexedDB if available:', err); return []; }
  };

  window.addOrUpdateMovie = addOrUpdateMovie = async function(movie){
    const body = JSON.stringify(movie || {});
    const hasId = movie && movie.id !== undefined && movie.id !== null && movie.id !== '';
    const url = hasId ? ('/api/movies/' + encodeURIComponent(movie.id)) : '/api/movies';
    const method = hasId ? 'PUT' : 'POST';
    return await apiFetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  };

  window.deleteMovieById = deleteMovieById = async function(id){
    await apiFetch('/api/movies/' + encodeURIComponent(id), { method:'DELETE' });
    if(typeof refreshRecords === 'function') await refreshRecords();
  };

  window.findMovieByTitle = findMovieByTitle = async function(title){
    const needle = String(title || '').trim().toLowerCase();
    if(!needle) return null;
    const list = await apiGetMovies();
    return list.find(x => String(x.title || '').trim().toLowerCase() === needle) || null;
  };

  window.refreshRecords = refreshRecords = async function(){
    records = await apiGetMovies();
    if(typeof buildColumnValues === 'function') buildColumnValues();
    if(typeof renderTable === 'function') renderTable();
  };

  async function refreshTrailerFromIMDb(){
    const rec = (typeof currentDetailIndex === 'number') ? (records[currentDetailIndex] || null) : null;
    if(!rec){ alert('Open a movie/series drawer first.'); return; }
    const imdbID = String(rec.imdbID || rec.imdb_id || '').trim();
    if(!/^ttd{5,}$/.test(imdbID)){
      alert('This title has no valid IMDb title ID. Add an IMDb ID first.');
      return;
    }
    const btn = document.getElementById('refreshImdbTrailerBtn');
    const hint = document.getElementById('trailerSaveHint');
    const oldText = btn ? btn.textContent : '';
    try{
      if(btn){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
      if(hint) hint.textContent = 'Searching IMDb for the latest direct MP4 trailer link…';
      const result = await apiFetch('/api/trailers/refresh', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ imdbID, title: rec.title || '', videoID: rec.trailerVideoID || rec.videoID || '' })
      });
      if(!result || !result.url) throw new Error('No direct MP4 trailer URL found.');
      rec.trailer = result.url;
      if(result.videoID) rec.trailerVideoID = result.videoID;
      rec.trailerFetchedAt = new Date().toISOString();
      await addOrUpdateMovie(rec);
      await refreshRecords();
      const nextIdx = records.findIndex(x => String(x.id) === String(rec.id));
      currentDetailIndex = nextIdx >= 0 ? nextIdx : currentDetailIndex;
      const fresh = records[currentDetailIndex] || rec;
      const input = document.getElementById('trailerLinkInput');
      if(input) input.value = fresh.trailer || '';
      if(typeof renderTrailerEmbed === 'function') renderTrailerEmbed(fresh);
      if(hint) hint.textContent = 'IMDb trailer refreshed and saved as direct MP4.';
    }catch(err){
      console.error(err);
      if(hint) hint.textContent = 'IMDb trailer refresh failed: ' + (err.message || err);
      alert('IMDb trailer refresh failed: ' + (err.message || err));
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = oldText || 'Refresh IMDb Trailer'; }
    }
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest && e.target.closest('#refreshImdbTrailerBtn');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    refreshTrailerFromIMDb();
  }, true);

  // Initial backend load. This refreshes the UI after the original local init.
  setTimeout(function(){ refreshRecords().catch(err => console.warn('Initial backend refresh failed:', err)); }, 0);
})();
</script>


<script>
/* ===== Ver38 YouTube Data API trailer search/save =====
   Requires backend environment variable: YOUTUBE_API_KEY
   Finds first embeddable YouTube result for "Title Year official trailer",
   saves watch URL to the movie, and re-renders the embedded drawer player.
*/
(function(){
  const canUseBackend = location.protocol === 'http:' || location.protocol === 'https:';
  if(!canUseBackend) return;

  async function youtubeApiFetch(url, options){
    const res = await fetch(url, options || {});
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok || (data && data.ok === false)){
      throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
    }
    return data;
  }

  async function refreshTrailerFromYouTube(){
    const rec = (typeof currentDetailIndex === 'number') ? (records[currentDetailIndex] || null) : null;
    if(!rec){ alert('Open a movie/series drawer first.'); return; }

    const btn = document.getElementById('refreshYoutubeTrailerBtn');
    const hint = document.getElementById('trailerSaveHint');
    const oldText = btn ? btn.textContent : '';

    try{
      if(btn){ btn.disabled = true; btn.textContent = 'Finding…'; }
      if(hint) hint.textContent = 'Searching YouTube for the first official trailer…';

      const result = await youtubeApiFetch('/api/trailers/youtube', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: rec.id || '', title: rec.title || '', year: rec.year || '' })
      });

      if(!result || !result.watchUrl) throw new Error('No YouTube trailer URL returned.');

      rec.trailer = result.watchUrl;
      rec.youtubeVideoId = result.videoId || '';
      rec.youtubeTrailerTitle = result.title || '';
      rec.youtubeTrailerFetchedAt = new Date().toISOString();

      if(typeof addOrUpdateMovie === 'function') await addOrUpdateMovie(rec);
      if(typeof refreshRecords === 'function') await refreshRecords();

      const nextIdx = records.findIndex(x => String(x.id) === String(rec.id));
      currentDetailIndex = nextIdx >= 0 ? nextIdx : currentDetailIndex;
      const fresh = records[currentDetailIndex] || rec;

      const input = document.getElementById('trailerLinkInput');
      if(input) input.value = fresh.trailer || result.watchUrl;
      if(typeof renderTrailerEmbed === 'function') renderTrailerEmbed(fresh);
      if(hint){
        hint.textContent = 'YouTube trailer saved: ' + (result.title || result.watchUrl);
      }
    }catch(err){
      console.error(err);
      const msg = err && err.message ? err.message : String(err);
      if(hint) hint.textContent = 'YouTube trailer search failed: ' + msg;
      alert('YouTube trailer search failed: ' + msg);
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = oldText || 'Find YouTube Trailer'; }
    }
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest && e.target.closest('#refreshYoutubeTrailerBtn');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    refreshTrailerFromYouTube();
  }, true);
})();
</script>


<script>
/* ===== Ver40 Bulk YouTube trailer fetch button =====
   Uses backend /api/trailers/youtube one title at a time.
   Cancel/OK prompt controls whether existing trailer links are overwritten.
*/
(function(){
  const canUseBackend = location.protocol === 'http:' || location.protocol === 'https:';
  if(!canUseBackend) return;

  function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }
  function looksLikeRealTrailer(v){
    const raw = String(v || '').trim();
    if(!raw) return false;
    if(/^(d+(.d+)?)$/.test(raw)) return false; // bad old rows where trailer field became rating
    return /youtu.be|youtube.com|youtube-nocookie.com|.(mp4|webm|ogg)(?|#|$)/i.test(raw);
  }
  async function bulkYoutubeApiFetch(url, options){
    const res = await fetch(url, options || {});
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok || (data && data.ok === false)){
      throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
    }
    return data || {};
  }
  async function runBulkYoutubeTrailerFetch(){
    const btn = document.getElementById('btnBulkYoutubeTrailers');
    const bar = document.getElementById('progressBar');
    if(!btn) return;

    const overwrite = confirm(
      'Fetch YouTube trailers for ALL titles and overwrite existing trailer links?

' +
      'OK = overwrite all trailers.
' +
      'Cancel = only fill titles with missing/bad trailer links.'
    );

    const source = (typeof getFilteredRows === 'function') ? getFilteredRows() : (records || []);
    const list = source.filter(r => r && String(r.title || '').trim() && (overwrite || !looksLikeRealTrailer(r.trailer)));

    if(!list.length){
      alert('No titles need YouTube trailer fetching.');
      return;
    }

    const yes = confirm('This will use YouTube Data API quota. Titles to process: ' + list.length + '. Continue?');
    if(!yes) return;

    let ok = 0, fail = 0;
    const oldText = btn.textContent;
    try{
      btn.disabled = true;
      if(bar) bar.style.width = '0%';

      for(let i=0; i<list.length; i++){
        const rec = list[i];
        btn.textContent = '🎬 YouTube ' + (i+1) + '/' + list.length;
        if(bar) bar.style.width = Math.round((i / list.length) * 100) + '%';
        try{
          const result = await bulkYoutubeApiFetch('/api/trailers/youtube', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id: rec.id || '', title: rec.title || '', year: rec.year || '' })
          });

          if(result && result.watchUrl){
            // update current memory too, so table/drawer updates without full reload every item
            rec.trailer = result.watchUrl;
            rec.youtubeVideoId = result.videoId || '';
            rec.youtubeTrailerTitle = result.title || '';
            rec.youtubeTrailerFetchedAt = new Date().toISOString();
            ok++;
          } else {
            fail++;
          }
        }catch(err){
          console.warn('YouTube trailer fetch failed for', rec.title, err);
          fail++;
        }
        // Small pause keeps UI responsive and avoids hammering backend/API.
        await sleep(180);
      }

      if(bar) bar.style.width = '100%';
      if(typeof refreshRecords === 'function') await refreshRecords();
      alert('Bulk YouTube trailer fetch complete. Saved: ' + ok + '. Failed/skipped: ' + fail + '.');
    }finally{
      btn.disabled = false;
      btn.textContent = oldText || '🎬 Fetch YouTube Trailers';
      if(bar) setTimeout(() => { bar.style.width = '0%'; }, 800);
    }
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest && e.target.closest('#btnBulkYoutubeTrailers');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    runBulkYoutubeTrailerFetch();
  }, true);
})();
</script>
