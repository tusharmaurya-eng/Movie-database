<style>
  :root{--bg:#f8fafc;--card:#fff;--muted:#64748b;--accent:#2563eb;--danger:#ef4444}
  *{box-sizing:border-box}
  body{font-family:Inter,system-ui,Arial;background:var(--bg);color:#0f172a;margin:0;padding:18px}
  .container{max-width:100%;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}

  .table-wrap{background:var(--card);border-radius:10px;box-shadow:0 6px 20px rgba(2,6,23,.06);overflow:hidden}.table-wrap>div{overflow-x:visible!important}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}thead th{background:#f1f5f9;padding:8px 44px 8px 7px;text-align:left;position:relative;user-select:none;cursor:pointer;white-space:normal}tbody td{padding:8px 7px;border-top:1px solid #eef2f6;vertical-align:top;word-break:break-word;overflow-wrap:anywhere}

<div class="container"><header><div><h1>MovieDB — Shared View</h1><div class="muted">Read-only shared file with filters, sorting and detail drawer.</div></div><div class="controls"><button id="openFilters" class="secondary">⚙️ Filters</button><input id="smallSearch" placeholder="Search"/><button id="btnReset" class="reset-btn">Reset</button></div></header>

<div id="filterContainer"></div>

function recordPassesFilters(r){for(const key of Object.keys(activeFilters)){if(!activeFilters[key]||activeFilters[key].size===0)continue;if(key==='genre'){const vals=splitVals(r.genre);if(!Array.from(activeFilters[key]).some(v=>vals.includes(v)))return false;}else if(key==='language'){const vals=splitVals(r.language);if(!Array.from(activeFilters[key]).some(v=>vals.includes(v)))return false;}else{const val=(key==='year'?extractReleaseYear(r.year):(r[key]||'[N/A]')).toString();if(!activeFilters[key].has(val))return false;}}const q=smallSearch.value.trim().toLowerCase();if(q){const hay=[r.title,r.genre,r.language,r.platform,r.year,r.imdb].join(' ').toLowerCase();if(!hay.includes(q))return false;}if(imdbFilter.enabled){const rating=parseFloat(r.imdb);if(Number.isNaN(rating))return false;if(imdbFilter.mode==='between'&&(rating<imdbFilter.min||rating>imdbFilter.max))return false;if(imdbFilter.mode==='gte'&&rating<imdbFilter.val)return false;if(imdbFilter.mode==='lte'&&rating>imdbFilter.val)return false;}return true;}

function renderTable(){resultsBody.innerHTML='';const visible=[];let sr=1;for(let i=0;i<records.length;i++){const r=records[i];if(!recordPassesFilters(r))continue;visible.push(i);const tr=document.createElement('tr');tr.innerHTML='<td>'+sr+++'</td><td><img src="'+escapeHtmlAttr(r.poster||'https://via.placeholder.com/150x220?text=No+Poster')+'" class="poster-thumb"></td><td style="font-weight:600;cursor:pointer">'+escapeHtml(r.title||'')+(r.imdbID?'<div class="muted">IMDb ID: '+escapeHtml(r.imdbID)+'</div>':'')+'</td><td>'+(extractReleaseYear(r.year)==='[N/A]'?'':escapeHtml(extractReleaseYear(r.year)))+'</td><td>'+escapeHtml(r.platform||'')+'</td><td>'+escapeHtml(r.imdb||'')+'</td><td>'+escapeHtml(r.language||'')+'</td><td>'+escapeHtml(r.genre||'')+'</td><td>'+escapeHtml(r.type||'')+'</td><td>'+(((r.type||'').toLowerCase()==='series'&&r.totalSeasons)?escapeHtml(String(r.totalSeasons)):'')+'</td>';tr.querySelector('img').onclick=()=>openDetailForIndex(i);tr.querySelector('td[style*="cursor:pointer"]').onclick=()=>openDetailForIndex(i);resultsBody.appendChild(tr);}lastVisibleIndices=visible;Object.keys(activeFilters).forEach(k=>updateHeaderIndicator(k));updateHeaderIndicator('imdb');}
function youtubeEmbedUrl(urlOrId){const raw=String(urlOrId||'').trim();if(!raw)return '';try{if(raw.includes('youtu.be/')){const id=raw.split('youtu.be/')[1].split(/[?&]/)[0];return id?'https://www.youtube.com/embed/'+id:'';}if(raw.includes('youtube.com')){const u=new URL(raw);const id=u.searchParams.get('v');if(id)return 'https://www.youtube.com/embed/'+id;if(raw.includes('/embed/'))return raw;}}catch(e){}if(/^[a-zA-Z0-9_-]{8,20}$/.test(raw))return 'https://www.youtube.com/embed/'+raw;return '';}
function isDirectVideoUrl(url){return /\.(mp4|webm|ogg)(\?|#|$)/i.test(String(url||'').trim());}
function getYouTubeSearchUrl(title){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(String(title||'')+' official trailer');}
function getYouTubeSearchEmbed(title){return 'https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(String(title||'')+' official trailer');}
function renderTrailerEmbed(rec){const box=document.getElementById('trailerEmbed');if(!box)return;const trailer=String(rec.trailer||'').trim();if(isDirectVideoUrl(trailer)){box.innerHTML='<div style="border:1px solid #eef2f6;border-radius:12px;overflow:hidden;background:#000"><video src="'+escapeHtmlAttr(trailer)+'" controls playsinline preload="metadata" style="width:100%;height:auto;max-height:420px;display:block;background:#000"></video></div>';return;}const yt=youtubeEmbedUrl(trailer);if(yt){box.innerHTML='<div style="border:1px solid #eef2f6;border-radius:12px;overflow:hidden;background:#000"><iframe src="'+escapeHtmlAttr(yt)+'" width="100%" height="315" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display:block"></iframe></div>';return;}box.innerHTML='<div style="padding:14px;border:1px solid #eef2f6;border-radius:12px;background:#fff"><div class="muted">No playable trailer link saved.</div><a href="'+escapeHtmlAttr(getYouTubeSearchUrl(rec.title||''))+'" target="_blank" style="margin-top:10px;display:inline-block;background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none">Search trailer on YouTube</a></div>';}

async function fetchActorImageWikipedia(actorName){
  try{
    const sUrl='https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(actorName)+'&utf8=&format=json&origin=*';
    const sRes=await fetch(sUrl); if(!sRes.ok)return null;
    const sJson=await sRes.json();
    if(!sJson.query||!sJson.query.search||!sJson.query.search.length)return null;
    const title=sJson.query.search[0].title;
    const pUrl='https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(title)+'&prop=pageimages&format=json&pithumbsize=200&origin=*';
    const pRes=await fetch(pUrl); if(!pRes.ok)return null;
    const pJson=await pRes.json();
    const pages=pJson.query&&pJson.query.pages?pJson.query.pages:null;
    if(!pages)return null;
    const page=Object.values(pages)[0];
    return page&&page.thumbnail&&page.thumbnail.source?page.thumbnail.source:null;
  }catch(e){return null;}
}
async function renderActorsRowWithThumbs(actors){
  actorRow.innerHTML='';
  const list=(actors||[]).map(a=>String(a).trim()).filter(Boolean).slice(0,6);
  if(!list.length){actorRow.innerHTML='<div class="muted">No actor data</div>';return;}
  const cacheKey='actorThumbCache_shared_v1';
  let cache={};
  try{cache=JSON.parse(sessionStorage.getItem(cacheKey)||'{}');}catch(e){cache={};}
  for(const name of list){
    const card=document.createElement('div');
    card.style.display='flex';card.style.alignItems='center';card.style.gap='10px';card.style.padding='8px 10px';card.style.border='1px solid #e6edf3';card.style.borderRadius='12px';card.style.background='#fff';
    const img=document.createElement('img');
    img.src=cache[name]||'https://via.placeholder.com/56x56?text=...';img.alt=name;img.style.width='56px';img.style.height='56px';img.style.objectFit='cover';img.style.borderRadius='10px';img.style.border='1px solid #eef2f6';
    const txt=document.createElement('div');txt.style.fontWeight='600';txt.style.fontSize='13px';txt.textContent=name;
    card.appendChild(img);card.appendChild(txt);actorRow.appendChild(card);
    if(cache[name])continue;
    const thumb=await fetchActorImageWikipedia(name);
    if(thumb){img.src=thumb;cache[name]=thumb;try{sessionStorage.setItem(cacheKey,JSON.stringify(cache));}catch(e){}}
    else img.src='https://via.placeholder.com/56x56?text=?';
  }
}
function renderActorsRow(actors){renderActorsRowWithThumbs(actors);}
function renderEpisodes(episodes){if(!episodes||!episodes.length){episodesList.innerHTML='<div class="muted">No episodes found.</div>';return;}episodesList.innerHTML=episodes.map(ep=>'<div style="padding:12px;border:1px solid #eef2f6;border-radius:12px;margin-bottom:10px;background:#fff"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="font-weight:700">S'+escapeHtml(seasonSelect.value)+'.E'+escapeHtml(ep.Episode)+' — '+escapeHtml(ep.Title||'')+'</div><div class="muted" style="white-space:nowrap">'+escapeHtml((ep.Released&&ep.Released!=='N/A')?ep.Released:'')+'</div></div><div class="muted" style="margin-top:6px">★ '+escapeHtml((ep.imdbRating&&ep.imdbRating!=='N/A')?ep.imdbRating:'')+'</div></div>').join('');}
function sortEpisodesTopRated(episodes){return [...episodes].sort((a,b)=>{const ra=parseFloat(a.imdbRating),rb=parseFloat(b.imdbRating);if(isNaN(ra)&&isNaN(rb))return 0;if(isNaN(ra))return 1;if(isNaN(rb))return -1;return rb-ra;});}
function renderEpisodesGroupedByYear(episodes){if(!episodes||!episodes.length){episodesList.innerHTML='<div class="muted">No episodes found.</div>';return;}const groups={};episodes.forEach(ep=>{const y=(ep.Released&&ep.Released!=='N/A')?ep.Released.slice(-4):'Unknown';if(!groups[y])groups[y]=[];groups[y].push(ep);});episodesList.innerHTML=Object.keys(groups).sort().map(y=>'<div style="margin-top:14px"><div style="font-weight:800">'+escapeHtml(y)+'</div>'+groups[y].map(ep=>'<div style="padding:10px;border:1px solid #eef2f6;border-radius:12px;margin-top:8px;background:#fff"><div style="display:flex;justify-content:space-between;gap:12px"><div style="font-weight:700">'+escapeHtml(ep.Episode||'')+'. '+escapeHtml(ep.Title||'')+'</div><div class="muted" style="white-space:nowrap">'+escapeHtml(ep.Released||'')+'</div></div><div class="muted" style="margin-top:6px">★ '+escapeHtml(ep.imdbRating||'')+'</div></div>').join('')+'</div>').join('');}
async function loadSeasonForDetail(imdbID,seasonNum){episodesList.innerHTML='<div class="muted">Loading Season '+seasonNum+'…</div>';try{const data=await fetchOneOMDb(DEFAULT_OMDB_KEY,{imdbID,season:seasonNum});if(!data||data.Response!=='True'){episodesList.innerHTML='<div class="muted">Could not load Season '+seasonNum+'.</div>';__currentSeasonEpisodes=[];return;}__currentSeasonEpisodes=(data.Episodes||[]).map(ep=>({Title:ep.Title||'',Released:ep.Released||'',Episode:ep.Episode||'',imdbRating:ep.imdbRating||'',imdbID:ep.imdbID||''}));seasonHint.textContent='Season '+seasonNum;if(__seriesMode==='top')renderEpisodes(sortEpisodesTopRated(__currentSeasonEpisodes));else if(__seriesMode==='years')renderEpisodesGroupedByYear(__currentSeasonEpisodes);else renderEpisodes(__currentSeasonEpisodes);}catch(err){episodesList.innerHTML='<div class="muted">Season load failed.</div>';__currentSeasonEpisodes=[];}}
function openDetailForIndex(idx){currentDetailIndex=idx;const rec=records[idx]||{};detailPoster.src=rec.poster||'https://via.placeholder.com/300x450?text=No+Poster';detailTitle.textContent=rec.title||'Untitled';detailMeta.textContent='Release Year '+(rec.year||'')+' - '+(rec.platform||'')+' — IMDB RATING★ '+(rec.imdb||'')+' — LANGUAGE: '+(rec.language||'');detailPlot.textContent=rec.plot||'No description available.';renderActorsRow(Array.isArray(rec.actors)?rec.actors.slice(0,6):[]);detailTrailer.href=rec.trailer?String(rec.trailer):getYouTubeSearchUrl(rec.title||'');renderTrailerEmbed(rec);const detailSeasonsEl=document.getElementById('detailSeasons');const isSeries=(rec.type||'').toLowerCase()==='series';const totalSeasons=rec.totalSeasons||'';if(detailSeasonsEl)detailSeasonsEl.textContent=(isSeries&&totalSeasons)?('Total Seasons: '+totalSeasons):'';if(seriesBlock&&isSeries&&isImdbId(rec.imdbID)&&totalSeasons){seriesBlock.style.display='block';seriesMeta.textContent='IMDb ID: '+rec.imdbID+' • Total Seasons: '+totalSeasons;seasonSelect.innerHTML='';for(let s=1;s<=parseInt(totalSeasons,10);s++){const opt=document.createElement('option');opt.value=String(s);opt.textContent='Season '+s;seasonSelect.appendChild(opt);}seasonSelect.value='1';seasonSelect.onchange=()=>loadSeasonForDetail(rec.imdbID,Number(seasonSelect.value));btnSeasons.onclick=()=>{__seriesMode='seasons';renderEpisodes(__currentSeasonEpisodes);};btnTopRated.onclick=()=>{__seriesMode='top';renderEpisodes(sortEpisodesTopRated(__currentSeasonEpisodes));};btnYears.onclick=()=>{__seriesMode='years';renderEpisodesGroupedByYear(__currentSeasonEpisodes);};__seriesMode='seasons';loadSeasonForDetail(rec.imdbID,1);}else{seriesBlock.style.display='none';episodesList.innerHTML='';seasonSelect.innerHTML='';seasonHint.textContent='';}detailPanel.classList.add('open');detailPanel.setAttribute('aria-hidden','false');}
function navigateDetail(delta){if(!lastVisibleIndices.length||currentDetailIndex===null)return;const pos=lastVisibleIndices.indexOf(currentDetailIndex);if(pos===-1)return;let nextPos=pos+delta;if(nextPos<0)nextPos=lastVisibleIndices.length-1;if(nextPos>=lastVisibleIndices.length)nextPos=0;openDetailForIndex(lastVisibleIndices[nextPos]);}
function closeDetailPanel(){detailPanel.classList.remove('open');detailPanel.setAttribute('aria-hidden','true');}
function toggleFilterDrawer(open){if(open){buildDrawerOptions();filterDrawer.classList.add('open');filterDrawer.setAttribute('aria-hidden','false');}else{filterDrawer.classList.remove('open');filterDrawer.setAttribute('aria-hidden','true');}}
function buildDrawerOptions(){buildColumnValues();drawerContent.innerHTML='';const single=new Set(['genre']);columnKeys.forEach(k=>{if(k==='imdb'){const sec=document.createElement('div');sec.className='section';sec.innerHTML='<strong>IMDb</strong>';const box=document.createElement('div');box.className='slider-box';box.innerHTML='<label><input id="imdbEnableDrawer" type="checkbox" '+(imdbFilter.enabled?'checked':'')+'> Enable</label><select id="imdbModeDrawer"><option value="between" '+(imdbFilter.mode==='between'?'selected':'')+'>Between</option><option value="gte" '+(imdbFilter.mode==='gte'?'selected':'')+'>≥</option><option value="lte" '+(imdbFilter.mode==='lte'?'selected':'')+'>≤</option></select><div id="imdbBetweenDrawer" style="'+(imdbFilter.mode==='between'?'':'display:none')+'"><div class="muted">Range: <span id="imdbMinLblD">'+imdbFilter.min.toFixed(1)+'</span> — <span id="imdbMaxLblD">'+imdbFilter.max.toFixed(1)+'</span></div><input id="imdbMinD" type="range" min="0" max="10" step="0.1" value="'+imdbFilter.min+'"><input id="imdbMaxD" type="range" min="0" max="10" step="0.1" value="'+imdbFilter.max+'"></div><div id="imdbSingleDrawer" style="'+(imdbFilter.mode!=='between'?'':'display:none')+'"><div class="muted">Value: <span id="imdbValLblD">'+imdbFilter.val.toFixed(1)+'</span></div><input id="imdbValD" type="range" min="0" max="10" step="0.1" value="'+imdbFilter.val+'"></div>';sec.appendChild(box);drawerContent.appendChild(sec);const enable=box.querySelector('#imdbEnableDrawer'),mode=box.querySelector('#imdbModeDrawer'),between=box.querySelector('#imdbBetweenDrawer'),singleBox=box.querySelector('#imdbSingleDrawer'),minR=box.querySelector('#imdbMinD'),maxR=box.querySelector('#imdbMaxD'),valR=box.querySelector('#imdbValD'),minLbl=box.querySelector('#imdbMinLblD'),maxLbl=box.querySelector('#imdbMaxLblD'),valLbl=box.querySelector('#imdbValLblD');const apply=()=>{updateHeaderIndicator('imdb');renderTable();};enable.onchange=()=>{imdbFilter.enabled=enable.checked;apply();};mode.onchange=()=>{imdbFilter.mode=mode.value;between.style.display=imdbFilter.mode==='between'?'':'none';singleBox.style.display=imdbFilter.mode==='between'?'none':'';apply();};minR.oninput=()=>{imdbFilter.min=parseFloat(minR.value);if(imdbFilter.min>imdbFilter.max){imdbFilter.max=imdbFilter.min;maxR.value=imdbFilter.max;}minLbl.textContent=imdbFilter.min.toFixed(1);maxLbl.textContent=imdbFilter.max.toFixed(1);apply();};maxR.oninput=()=>{imdbFilter.max=parseFloat(maxR.value);if(imdbFilter.max<imdbFilter.min){imdbFilter.min=imdbFilter.max;minR.value=imdbFilter.min;}minLbl.textContent=imdbFilter.min.toFixed(1);maxLbl.textContent=imdbFilter.max.toFixed(1);apply();};valR.oninput=()=>{imdbFilter.val=parseFloat(valR.value);valLbl.textContent=imdbFilter.val.toFixed(1);apply();};return;}const sec=document.createElement('div');sec.className='section';sec.innerHTML='<strong style="text-transform:capitalize">'+escapeHtml(k)+'</strong>';const list=document.createElement('div');(columnValues[k]||[]).forEach(v=>{const lab=document.createElement('label');lab.style.display='flex';lab.style.gap='8px';lab.style.alignItems='center';lab.style.marginBottom='6px';const cb=document.createElement('input');cb.type='checkbox';cb.dataset.key=k;cb.value=String(v);if(activeFilters[k]&&activeFilters[k].has(String(v)))cb.checked=true;cb.onchange=()=>{if(single.has(k)&&cb.checked){drawerContent.querySelectorAll('input[type="checkbox"][data-key="'+k+'"]').forEach(o=>{if(o!==cb)o.checked=false;});}const checks=Array.from(drawerContent.querySelectorAll('input[type=checkbox]'));const nf={};checks.forEach(x=>{if(x.checked){const kk=x.dataset.key;if(!nf[kk])nf[kk]=new Set();nf[kk].add(x.value);}});activeFilters=nf;document.querySelectorAll('.active-indicator').forEach(n=>n.remove());Object.keys(activeFilters).forEach(kk=>updateHeaderIndicator(kk));renderTable();};const span=document.createElement('span');span.textContent=String(v);lab.appendChild(cb);lab.appendChild(span);list.appendChild(lab);});sec.appendChild(list);drawerContent.appendChild(sec);});}
function filterDrawerOptions(){const q=drawerSearch.value.trim().toLowerCase();Array.from(drawerContent.querySelectorAll('label')).forEach(l=>{const txt=l.textContent.toLowerCase();l.style.display=txt.includes(q)?'flex':'none';});}
function clearAllInDrawer(){Array.from(drawerContent.querySelectorAll('input[type=checkbox]')).forEach(cb=>cb.checked=false);activeFilters={};imdbFilter={enabled:false,mode:'between',min:0,max:10,val:7};document.querySelectorAll('.active-indicator').forEach(n=>n.remove());renderTable();}
function applyDrawerFilters(){toggleFilterDrawer(false);}
function resetFilters(){activeFilters={};imdbFilter={enabled:false,mode:'between',min:0,max:10,val:7};document.querySelectorAll('.active-indicator').forEach(n=>n.remove());smallSearch.value='';renderTable();closeAllPopovers();}
document.querySelector('#resultsTable thead').addEventListener('click',e=>{const fbtn=e.target.closest('.filter-btn');if(fbtn){e.preventDefault();e.stopPropagation();toggleFilterPopover(fbtn.dataset.key,fbtn);return;}const th=e.target.closest('th');if(th&&th.dataset.key)sortByKey(th.dataset.key);});
smallSearch.oninput=renderTable;btnReset.onclick=resetFilters;openFilters.onclick=()=>toggleFilterDrawer(true);closeDrawer.onclick=()=>toggleFilterDrawer(false);clearAllDrawer.onclick=clearAllInDrawer;applyDrawer.onclick=applyDrawerFilters;drawerSearch.oninput=filterDrawerOptions;closeDetail.onclick=closeDetailPanel;prevBtn.onclick=()=>navigateDetail(-1);nextBtn.onclick=()=>navigateDetail(1);
document.addEventListener('keydown',e=>{if(detailPanel.classList.contains('open')){if(e.key==='ArrowLeft')navigateDetail(-1);if(e.key==='ArrowRight')navigateDetail(1);if(e.key==='Escape')closeDetailPanel();}if(filterDrawer.classList.contains('open')&&e.key==='Escape')toggleFilterDrawer(false);});
document.addEventListener('mousedown',e=>{if(filterDrawer.classList.contains('open')&&!filterDrawer.contains(e.target)&&!openFilters.contains(e.target))toggleFilterDrawer(false);if(detailPanel.classList.contains('open')&&!detailPanel.contains(e.target))closeDetailPanel();});
document.addEventListener('click',e=>{if(!e.target.closest('.filter-pop')&&!e.target.matches('.filter-btn'))closeAllPopovers();});
buildColumnValues();renderTable();
